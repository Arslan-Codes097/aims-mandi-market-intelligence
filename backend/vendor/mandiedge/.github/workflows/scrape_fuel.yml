name: Daily Fuel Scraper

on:
  schedule:
    # Runs at 21:00 UTC every day, which is 2:00 AM Pakistan Standard Time (PST)
    - cron: '0 21 * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  scrape-fuel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 supabase python-dotenv pandas

      - name: Run Fuel Scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python scraper/fuel.py
